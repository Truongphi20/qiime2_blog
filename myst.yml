version: 1
project:
  id: qiime2-blog-docs
  title: "QIIME2 Blog"
  description: "From black box to glass box"
  keywords: 
    - qiime2
    - understanding
    - moving-picture-tutorial
  authors: 
    - name: Phi Nguyen 
  github: https://github.com/Truongphi20/qiime2_blog
  bibliography:
    - docs/static/references.bib
  numbering:
    math: false
  toc:
    - title: Overview
      file: docs/index.md
    - title: Demultiplexing
      file: docs/demultiplexing.md
    - title: Denoising
      children:
        - title: DADA2
          file: docs/dada2.md
        - title: Deblur
          file: docs/deblur.md
    - title: Diversity
      children:
        - title: Alpha diversity
          file: docs/alpha-div.md
        - title: Beta diversity
          file: docs/beta-div.md
    - title: Alpha rarefaction
      file: docs/alpha-rarefaction.md
    - title: Methology
      file: docs/method.md
    
site:
  template: book-theme
  options:
    folders: true
    favicon: docs/static/logo.png
    logo: docs/static/logan.png
    style: docs/static/styles.css
